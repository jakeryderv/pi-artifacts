name: release

# Publishes @jakeryderv/pi-artifacts when a v* tag is pushed. Authentication is
# npm trusted publishing (OIDC) — no NPM_TOKEN secret. This requires a one-time
# grant on the npm side, naming this repository and this workflow file, from
# npmjs.com → the package → Settings → Trusted publisher → GitHub Actions
# (repository `jakeryderv/pi-artifacts`, workflow `release.yml`). npm 12 can also
# do it from the CLI via `npm trust github`, but that needs Node >= 24.15.
#
# Publishing over OIDC also attaches a provenance attestation automatically.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for the OIDC token used by trusted publishing and provenance.
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, newer than some Node 24 images.
      # Held at 11.x deliberately: npm 12 requires Node >= 24.15, which the
      # `node-version: 24` pin above does not guarantee.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run lint:md
      - run: npm run lint:deps
      - run: npm run pack:check -- --json

      - run: npm publish
