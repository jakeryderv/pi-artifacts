name: Feature request
description: Suggest a focused improvement to pi-artifacts.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve pi-artifacts. Please describe the user problem before prescribing an implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and where does the current package fall short?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and how it would work from a Pi session.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Markdown artifacts
        - HTML artifacts
        - Viewer
        - Export
        - Storage and cleanup
        - Package demos
        - Documentation or developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any current workaround or alternative design you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, sample artifact content, or links that clarify the request.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request preserves the content-only artifact security model, or explains why the model should change.
          required: true
