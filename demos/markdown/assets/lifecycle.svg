      <text x="360" y="129">Author</text>
      <text x="590" y="129">Preview</text>
      <text x="820" y="129">Export</text>
    </g>
    <g stroke="#0891b2" stroke-width="5" stroke-linecap="round">
      <path d="M225 120h38" />
      <path d="M455 120h38" />
      <path d="M685 120h38" />
    </g>
    <g fill="#0891b2">
      <path d="m263 120-12-8v16z" />
      <path d="m493 120-12-8v16z" />
      <path d="m723 120-12-8v16z" />
    </g>
  </g>
</svg>
